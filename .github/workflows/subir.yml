name: Subir post a borradores de TikTok

# Lo dispara la app del celular (botón "Subir a borradores") o a mano desde la pestaña Actions.
on:
  workflow_dispatch:
    inputs:
      post:
        description: "Número del post (ej. 127)"
        required: true

permissions:
  contents: read

concurrency:
  group: subir-tiktok
  cancel-in-progress: false

jobs:
  subir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/data
            scripts
          sparse-checkout-mode: cone
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Subir a borradores
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          POST_ID: ${{ inputs.post }}
          SITE: https://nahubarreraa.github.io/nahuel-tiktok-legal
        run: node scripts/subir.js

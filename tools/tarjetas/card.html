<!doctype html>
<html><head><meta charset="utf-8">
<!-- Plantilla de tarjeta 1080x1920. Lee cards.js (window.CARDS) del mismo directorio. Indice por hash: card.html#0 -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Georgia","Noto Serif",serif}
#c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.5) contrast(1.15)}
.v{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 100%)}
.q{position:absolute;left:90px;right:90px;top:480px;height:600px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:76px;line-height:1.28;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.q.sm{font-size:64px}
.a{position:absolute;left:0;right:0;top:1330px;text-align:center;color:#d9d9d9;font-style:italic;font-size:48px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
</style></head><body>
<div id="c"></div>
<script src="cards.js"></script>
<script>
const k=window.CARDS[+(location.hash.slice(1)||0)];
const long=k.q.length>95;
document.getElementById("c").innerHTML=
 `<img src="${k.bg}"><div class="v"></div><div class="q${long?' sm':''}">${k.q}</div>${k.a?`<div class="a">— ${k.a} —</div>`:''}`;
</script></body></html>

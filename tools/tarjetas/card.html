<!doctype html>
<html><head><meta charset="utf-8">
<!-- Plantilla de tarjeta 1080x1920. Lee cards.js (window.CARDS) del mismo directorio. Indice por hash: card.html#0
     Para ver la zona tapada por la interfaz de TikTok: card.html#0safe -->
<style>
html,body{margin:0;width:1080px;height:1920px;background:#000;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"Georgia","Noto Serif",serif}
#c img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.5) contrast(1.15)}
.v{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 30%,rgba(0,0,0,.75) 100%)}
/* Zona visible en TikTok: sin barra superior (~0-200), sin descripcion/menu inferior (~1440-1920) ni botones a la derecha (x>940). */
.q{position:absolute;left:130px;right:130px;top:620px;height:600px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:74px;line-height:1.28;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.q.sm{font-size:64px}
.a{position:absolute;left:0;right:0;top:1270px;text-align:center;color:#d9d9d9;font-style:italic;font-size:48px;text-shadow:0 2px 16px rgba(0,0,0,.8)}
.s1,.s2,.s3{position:absolute;background:rgba(255,0,0,.35);outline:2px solid #f00}
.s1{left:0;right:0;top:0;height:200px}.s2{left:0;right:0;top:1440px;bottom:0}.s3{left:940px;width:140px;top:800px;height:640px}
</style></head><body>
<div id="c"></div>
<script src="cards.js"></script>
<script>
const h=location.hash.slice(1);
const k=window.CARDS[parseInt(h||'0')];
const long=k.q.length>95;
document.getElementById("c").innerHTML=
 `<img src="${k.bg}"><div class="v"></div><div class="q${long?' sm':''}"><span>${k.q}</span></div>${k.a?`<div class="a">— ${k.a} —</div>`:''}`+(h.includes('safe')?'<div class="s1"></div><div class="s2"></div><div class="s3"></div>':'');
</script></body></html>
